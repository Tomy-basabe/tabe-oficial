  <!-- Redirección inmediata ultra-temprana desde dominios antiguos preservando path, query y hash (#access_token) -->
  <script>
    (function () {
      var h = window.location.hostname;
      if (h === 'tabe.software' || h === 'www.tabe.software' || h === 'tabe-oficial.vercel.app') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) caches.delete(names[i]);
          });
        }
        window.location.replace('https://tabe.com.ar' + window.location.pathname + window.location.search + window.location.hash);
      }
    })();
  </script>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var isDark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
        }
        var activeColor = localStorage.getItem("active-theme-color");
        if (activeColor) {
          if (document.body) {
            document.body.classList.add(activeColor);
          } else {
            document.addEventListener("DOMContentLoaded", function () {
              if (document.body) document.body.classList.add(activeColor);
            });
          }
        }
      } catch (e) {}
    })();
  </script>

      <p>TABE es tu asistente de bolsillo estudiantil para universitarios: organizá materias, correlatividades, flashcards con IA, apuntes colaborativos, técnica Pomodoro y métricas en una sola app.</p>

      <h2>Funcionalidades principales</h2>
      <ul>
        <li><strong>Plan de Carrera:</strong> Organizá todas tus materias, correlatividades y seguí tu progreso hacia la graduación.</li>
        <li><strong>Flashcards con IA:</strong> Generá mazos de flashcards automáticamente con inteligencia artificial a partir de cualquier tema.</li>
        <li><strong>Cuestionarios inteligentes:</strong> Creá cuestionarios de opción múltiple con IA para practicar antes de los exámenes.</li>
        <li><strong>Calendario académico:</strong> Agendá parciales, finales, TPs y entregas. Sincronizá con Google Calendar.</li>

        <li><strong>Métricas de estudio:</strong> Visualizá tu rendimiento, horas de estudio, promedios y tendencias.</li>
        <li><strong>Editor de apuntes:</strong> Creá y organizá tus apuntes con un editor tipo Notion integrado.</li>
        <li><strong>Sistema de logros:</strong> Ganá XP y logros por estudiar, completar sesiones y alcanzar metas académicas.</li>
        <li><strong>Comunidad:</strong> Conectá con otros estudiantes, compartí recursos y estudiá en grupo.</li>

      <h2>¿Qué es TABE?</h2>
      <p>TABE (Tu Asistente de Bolsillo Estudiantil) es una aplicación web gratuita diseñada especialmente para estudiantes universitarios en Argentina. Combina las mejores herramientas de estudio en una sola plataforma: organización de materias con correlatividades, generación automática de flashcards y cuestionarios usando inteligencia artificial, calendario académico con sincronización a Google Calendar, temporizador Pomodoro con seguimiento por materia, un asistente de IA personalizado que conoce tu carrera, y métricas detalladas de tu rendimiento académico.</p>

      <h2>¿Cómo empezar?</h2>
      <p>Registrate gratis en <a href="https://tabe.com.ar/registro" style="color:#00d9ff;">tabe.com.ar/registro</a> y configurá tu carrera en minutos. TABE se adapta a cualquier universidad y plan de estudios.</p>

      <p>Sí, T.A.B.E. ofrece un plan gratuito con todas las funcionalidades esenciales para organizar tu estudio universitario.</p>
      <h3>¿Funciona en celular?</h3>
